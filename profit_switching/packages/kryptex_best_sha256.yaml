# Coin SHA-256 le plus rentable selon Kryptex, en USD par jour pour 1 TH/s (frais du pool déduits).
# FICHIER GÉNÉRÉ par tools/gen_kryptex_package.py : pour ajouter un coin, modifiez la liste COINS du
# script puis relancez-le, plutôt que ce fichier.
#
# Ce package est INDÉPENDANT de tout mineur et de l'intégration Vnish : il ne lit que l'API publique de
# Kryptex. Installation : copiez-le dans config/packages/ (après avoir activé les packages dans
# configuration.yaml :  homeassistant: { packages: !include_dir_named packages }), puis redémarrez.
#
# Pour chaque coin : `Kryptex gain` = coin gagné par TH/s et par jour (`estimated_profit_day` x 1e12),
# `Kryptex prix` = dernier point de la courbe de prix (USD), `Kryptex rentabilité` = gain x prix, sans minage fusionné.
# Le Quai n'a pas d'estimation chez Kryptex (null) : il est calculé depuis K1Pool (récompense x blocs par
# jour / hashrate du réseau, frais déduits) par les capteurs `K1Pool gain Quai` et `K1Pool rentabilité Quai`,
# et corrigé par `Quai (K1Pool) : correction du gain`. ATTENTION : les pools ne s'accordent pas sur le temps
# de bloc du Quai (écart d'un facteur ~4,3) : calibrez ce réglage sur vos gains réels (voir le README).
#
# Seul le gain PROPRE de chaque coin est compté : le minage fusionné (par exemple BTC + FB, annoncé par
# Kryptex) n'est pas ajouté, pour ne pas surestimer.

# Remis à cette valeur à chaque redémarrage de Home Assistant : écrivez ici la valeur calibrée.
input_number:
  k1pool_quai_factor:
    name: "Quai (K1Pool) : correction du gain"
    icon: mdi:tune
    min: 0.1
    max: 10
    step: 0.05
    initial: 1
    mode: box

# --- Données Kryptex ---------------------------------------------------------------
rest:
  - resource: https://pool.kryptex.com/btc/api/v1/pool/info
    scan_interval: 600
    sensor:
      - name: "Kryptex gain BTC"
        unique_id: kryptex_gain_btc
        unit_of_measurement: "BTC/TH/jour"
        value_template: "{% if value_json.estimated_profit_day is number %}{{ value_json.estimated_profit_day * 1e12 }}{% else %}unknown{% endif %}"
        json_attributes:
          - fee
  - resource: https://pool.kryptex.com/api/v1/coin/btc/price/chart
    scan_interval: 1800   # la courbe a un point par heure
    sensor:
      - name: "Kryptex prix BTC"
        unique_id: kryptex_prix_btc
        unit_of_measurement: "USD"
        value_template: "{% set last = value_json | last %}{{ last.price if last is mapping else 'unknown' }}"
  - resource: https://pool.kryptex.com/bch/api/v1/pool/info
    scan_interval: 600
    sensor:
      - name: "Kryptex gain BCH"
        unique_id: kryptex_gain_bch
        unit_of_measurement: "BCH/TH/jour"
        value_template: "{% if value_json.estimated_profit_day is number %}{{ value_json.estimated_profit_day * 1e12 }}{% else %}unknown{% endif %}"
        json_attributes:
          - fee
  - resource: https://pool.kryptex.com/api/v1/coin/bch/price/chart
    scan_interval: 1800   # la courbe a un point par heure
    sensor:
      - name: "Kryptex prix BCH"
        unique_id: kryptex_prix_bch
        unit_of_measurement: "USD"
        value_template: "{% set last = value_json | last %}{{ last.price if last is mapping else 'unknown' }}"
  - resource: https://pool.kryptex.com/fb/api/v1/pool/info
    scan_interval: 600
    sensor:
      - name: "Kryptex gain FB"
        unique_id: kryptex_gain_fb
        unit_of_measurement: "FB/TH/jour"
        value_template: "{% if value_json.estimated_profit_day is number %}{{ value_json.estimated_profit_day * 1e12 }}{% else %}unknown{% endif %}"
        json_attributes:
          - fee
  - resource: https://pool.kryptex.com/api/v1/coin/fb/price/chart
    scan_interval: 1800   # la courbe a un point par heure
    sensor:
      - name: "Kryptex prix FB"
        unique_id: kryptex_prix_fb
        unit_of_measurement: "USD"
        value_template: "{% set last = value_json | last %}{{ last.price if last is mapping else 'unknown' }}"
  - resource: https://pool.kryptex.com/xec/api/v1/pool/info
    scan_interval: 600
    sensor:
      - name: "Kryptex gain XEC"
        unique_id: kryptex_gain_xec
        unit_of_measurement: "XEC/TH/jour"
        value_template: "{% if value_json.estimated_profit_day is number %}{{ value_json.estimated_profit_day * 1e12 }}{% else %}unknown{% endif %}"
        json_attributes:
          - fee
  - resource: https://pool.kryptex.com/api/v1/coin/xec/price/chart
    scan_interval: 1800   # la courbe a un point par heure
    sensor:
      - name: "Kryptex prix XEC"
        unique_id: kryptex_prix_xec
        unit_of_measurement: "USD"
        value_template: "{% set last = value_json | last %}{{ last.price if last is mapping else 'unknown' }}"
  - resource: https://pool.kryptex.com/dgb/api/v1/pool/info
    scan_interval: 600
    sensor:
      - name: "Kryptex gain DGB"
        unique_id: kryptex_gain_dgb
        unit_of_measurement: "DGB/TH/jour"
        value_template: "{% if value_json.estimated_profit_day is number %}{{ value_json.estimated_profit_day * 1e12 }}{% else %}unknown{% endif %}"
        json_attributes:
          - fee
  - resource: https://pool.kryptex.com/api/v1/coin/dgb/price/chart
    scan_interval: 1800   # la courbe a un point par heure
    sensor:
      - name: "Kryptex prix DGB"
        unique_id: kryptex_prix_dgb
        unit_of_measurement: "USD"
        value_template: "{% set last = value_json | last %}{{ last.price if last is mapping else 'unknown' }}"
  - resource: https://pool.kryptex.com/bsv/api/v1/pool/info
    scan_interval: 600
    sensor:
      - name: "Kryptex gain BSV"
        unique_id: kryptex_gain_bsv
        unit_of_measurement: "BSV/TH/jour"
        value_template: "{% if value_json.estimated_profit_day is number %}{{ value_json.estimated_profit_day * 1e12 }}{% else %}unknown{% endif %}"
        json_attributes:
          - fee
  - resource: https://pool.kryptex.com/api/v1/coin/bsv/price/chart
    scan_interval: 1800   # la courbe a un point par heure
    sensor:
      - name: "Kryptex prix BSV"
        unique_id: kryptex_prix_bsv
        unit_of_measurement: "USD"
        value_template: "{% set last = value_json | last %}{{ last.price if last is mapping else 'unknown' }}"

  # K1Pool : Kryptex n'a pas d'estimation pour le Quai, on la calcule (voir l'en-tête).
  - resource: https://k1pool.com/api/stats/quaisha256
    scan_interval: 600
    sensor:
      - name: "K1Pool gain Quai"
        unique_id: k1pool_gain_quai
        unit_of_measurement: "QUAI/TH/jour"
        value_template: "{% set j = value_json %}{% if j.coinReward is number and j.coinBlocktime is number and j.networkSpeed is number and j.coinBlocktime > 0 and j.networkSpeed > 0 %}{{ (j.coinReward * 86400 / j.coinBlocktime * 1e12 / j.networkSpeed) | round(4) }}{% else %}unknown{% endif %}"
        json_attributes:
          - coinPriceUsd
          - coinPoolFee

# --- Rentabilité par coin, puis classement --------------------------------------------
template:
  - sensor:
      - name: "Kryptex rentabilité BTC"
        unique_id: kryptex_profit_btc
        unit_of_measurement: "USD/TH/jour"
        state: >-
          {{ (states('sensor.kryptex_gain_btc') | float * states('sensor.kryptex_prix_btc') | float) | round(5) }}
        availability: >-
          {{ states('sensor.kryptex_gain_btc') | is_number and states('sensor.kryptex_prix_btc') | is_number }}
      - name: "Kryptex rentabilité BCH"
        unique_id: kryptex_profit_bch
        unit_of_measurement: "USD/TH/jour"
        state: >-
          {{ (states('sensor.kryptex_gain_bch') | float * states('sensor.kryptex_prix_bch') | float) | round(5) }}
        availability: >-
          {{ states('sensor.kryptex_gain_bch') | is_number and states('sensor.kryptex_prix_bch') | is_number }}
      - name: "Kryptex rentabilité FB"
        unique_id: kryptex_profit_fb
        unit_of_measurement: "USD/TH/jour"
        state: >-
          {{ (states('sensor.kryptex_gain_fb') | float * states('sensor.kryptex_prix_fb') | float) | round(5) }}
        availability: >-
          {{ states('sensor.kryptex_gain_fb') | is_number and states('sensor.kryptex_prix_fb') | is_number }}
      - name: "Kryptex rentabilité XEC"
        unique_id: kryptex_profit_xec
        unit_of_measurement: "USD/TH/jour"
        state: >-
          {{ (states('sensor.kryptex_gain_xec') | float * states('sensor.kryptex_prix_xec') | float) | round(5) }}
        availability: >-
          {{ states('sensor.kryptex_gain_xec') | is_number and states('sensor.kryptex_prix_xec') | is_number }}
      - name: "Kryptex rentabilité DGB"
        unique_id: kryptex_profit_dgb
        unit_of_measurement: "USD/TH/jour"
        state: >-
          {{ (states('sensor.kryptex_gain_dgb') | float * states('sensor.kryptex_prix_dgb') | float) | round(5) }}
        availability: >-
          {{ states('sensor.kryptex_gain_dgb') | is_number and states('sensor.kryptex_prix_dgb') | is_number }}
      - name: "Kryptex rentabilité BSV"
        unique_id: kryptex_profit_bsv
        unit_of_measurement: "USD/TH/jour"
        state: >-
          {{ (states('sensor.kryptex_gain_bsv') | float * states('sensor.kryptex_prix_bsv') | float) | round(5) }}
        availability: >-
          {{ states('sensor.kryptex_gain_bsv') | is_number and states('sensor.kryptex_prix_bsv') | is_number }}
      - name: "K1Pool rentabilité Quai"
        unique_id: k1pool_profit_quai
        unit_of_measurement: "USD/TH/jour"
        state: >-
          {{ (states('sensor.k1pool_gain_quai') | float
              * state_attr('sensor.k1pool_gain_quai', 'coinPriceUsd') | float
              * (1 - state_attr('sensor.k1pool_gain_quai', 'coinPoolFee') | float / 100)
              * states('input_number.k1pool_quai_factor') | float) | round(5) }}
        availability: >-
          {{ states('sensor.k1pool_gain_quai') | is_number
             and state_attr('sensor.k1pool_gain_quai', 'coinPriceUsd') | is_number
             and state_attr('sensor.k1pool_gain_quai', 'coinPoolFee') | is_number
             and states('input_number.k1pool_quai_factor') | is_number }}

      - name: "Meilleur coin SHA256 (Kryptex)"
        unique_id: kryptex_best_sha256
        icon: mdi:trophy
        state: >-
          {% set ns = namespace(rows=[]) %}
          {% for c, entity in {'BTC': 'sensor.kryptex_rentabilite_btc', 'BCH': 'sensor.kryptex_rentabilite_bch', 'FB': 'sensor.kryptex_rentabilite_fb', 'XEC': 'sensor.kryptex_rentabilite_xec', 'DGB': 'sensor.kryptex_rentabilite_dgb', 'BSV': 'sensor.kryptex_rentabilite_bsv', 'QUAI': 'sensor.k1pool_rentabilite_quai'}.items() %}
            {% set v = states(entity) %}
            {% if v | is_number %}{% set ns.rows = ns.rows + [{'coin': c, 'usd': v | float}] %}{% endif %}
          {% endfor %}
          {% set rows = ns.rows | sort(attribute='usd', reverse=true) %}
          {{ rows[0].coin if rows else 'unknown' }}
        availability: >-
          {% set ns = namespace(rows=[]) %}
          {% for c, entity in {'BTC': 'sensor.kryptex_rentabilite_btc', 'BCH': 'sensor.kryptex_rentabilite_bch', 'FB': 'sensor.kryptex_rentabilite_fb', 'XEC': 'sensor.kryptex_rentabilite_xec', 'DGB': 'sensor.kryptex_rentabilite_dgb', 'BSV': 'sensor.kryptex_rentabilite_bsv', 'QUAI': 'sensor.k1pool_rentabilite_quai'}.items() %}
            {% set v = states(entity) %}
            {% if v | is_number %}{% set ns.rows = ns.rows + [{'coin': c, 'usd': v | float}] %}{% endif %}
          {% endfor %}
          {% set rows = ns.rows | sort(attribute='usd', reverse=true) %}
          {{ rows | length > 0 }}
        attributes:
          usd_th_jour: >-
            {% set ns = namespace(rows=[]) %}
            {% for c, entity in {'BTC': 'sensor.kryptex_rentabilite_btc', 'BCH': 'sensor.kryptex_rentabilite_bch', 'FB': 'sensor.kryptex_rentabilite_fb', 'XEC': 'sensor.kryptex_rentabilite_xec', 'DGB': 'sensor.kryptex_rentabilite_dgb', 'BSV': 'sensor.kryptex_rentabilite_bsv', 'QUAI': 'sensor.k1pool_rentabilite_quai'}.items() %}
              {% set v = states(entity) %}
              {% if v | is_number %}{% set ns.rows = ns.rows + [{'coin': c, 'usd': v | float}] %}{% endif %}
            {% endfor %}
            {% set rows = ns.rows | sort(attribute='usd', reverse=true) %}
            {{ rows[0].usd if rows else none }}
          classement: >-
            {% set ns = namespace(rows=[]) %}
            {% for c, entity in {'BTC': 'sensor.kryptex_rentabilite_btc', 'BCH': 'sensor.kryptex_rentabilite_bch', 'FB': 'sensor.kryptex_rentabilite_fb', 'XEC': 'sensor.kryptex_rentabilite_xec', 'DGB': 'sensor.kryptex_rentabilite_dgb', 'BSV': 'sensor.kryptex_rentabilite_bsv', 'QUAI': 'sensor.k1pool_rentabilite_quai'}.items() %}
              {% set v = states(entity) %}
              {% if v | is_number %}{% set ns.rows = ns.rows + [{'coin': c, 'usd': v | float}] %}{% endif %}
            {% endfor %}
            {% set rows = ns.rows | sort(attribute='usd', reverse=true) %}
            {% set out = namespace(lines=[]) %}
            {% for r in rows %}{% set out.lines = out.lines + [r.coin ~ ' = ' ~ (r.usd | round(5))] %}{% endfor %}
            {{ out.lines }}
          indisponibles: >-
            {% set ok = namespace(coins=[]) %}
            {% for c, entity in {'BTC': 'sensor.kryptex_rentabilite_btc', 'BCH': 'sensor.kryptex_rentabilite_bch', 'FB': 'sensor.kryptex_rentabilite_fb', 'XEC': 'sensor.kryptex_rentabilite_xec', 'DGB': 'sensor.kryptex_rentabilite_dgb', 'BSV': 'sensor.kryptex_rentabilite_bsv', 'QUAI': 'sensor.k1pool_rentabilite_quai'}.items() %}
              {% if states(entity) | is_number %}{% set ok.coins = ok.coins + [c] %}{% endif %}
            {% endfor %}
            {{ ['BTC', 'BCH', 'FB', 'XEC', 'DGB', 'BSV', 'QUAI'] | reject('in', ok.coins) | list }}

      - name: "Gain du meilleur coin SHA256"
        unique_id: kryptex_best_sha256_usd
        unit_of_measurement: "USD/TH/jour"
        icon: mdi:currency-usd
        state: "{{ state_attr('sensor.meilleur_coin_sha256_kryptex', 'usd_th_jour') | round(5) }}"
        availability: "{{ state_attr('sensor.meilleur_coin_sha256_kryptex', 'usd_th_jour') is number }}"
