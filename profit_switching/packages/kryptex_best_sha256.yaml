# --- Rentabilité par coin, puis classement --------------------------------------------
template:
  - sensor:
      - name: "Kryptex rentabilité BTC"
        unique_id: kryptex_profit_btc
        unit_of_measurement: "USD/TH/jour"
        state: >-
          {% set own = states('sensor.kryptex_gain_btc') | float * states('sensor.kryptex_prix_btc') | float %}
          {% set ns = namespace(extra=0) %}
          {% if is_state('input_boolean.kryptex_include_merged', 'on') %}
            {% for t in (state_attr('sensor.kryptex_gain_btc', 'mergemining') or '').split(',') | map('trim') | map('lower') | reject('eq', '') %}
              {% set ns.extra = ns.extra + states('sensor.kryptex_gain_' ~ t) | float(0) * states('sensor.kryptex_prix_' ~ t) | float(0) %}
            {% endfor %}
          {% endif %}
          {{ (own + ns.extra) | round(5) }}
        availability: >-
          {{ states('sensor.kryptex_gain_btc') | is_number and states('sensor.kryptex_prix_btc') | is_number }}
        attributes:
          gain_propre: >-
            {{ (states('sensor.kryptex_gain_btc') | float(0) * states('sensor.kryptex_prix_btc') | float(0)) | round(5) }}
          minage_fusionne: >-
            {{ state_attr('sensor.kryptex_gain_btc', 'mergemining') or '' }}
