# Bascule automatique du pool selon la rentabilité : BTC (pool 1) / BSV (pool 2) / Quai (pool 3).
#
# C'est un « package » Home Assistant : copiez ce fichier dans config/packages/ (après avoir activé
# les packages dans configuration.yaml :  homeassistant: { packages: !include_dir_named packages })
# puis redémarrez. Voir le README, section « Bascule automatique selon la rentabilité ».
#
# Les numéros de pool sont ceux du menu `select.<mineur>_active_pool` : 1, 2, 3 = les trois pools de
# la table Vnish, dans l'ordre. Ici : 1 = BTC (f2pool), 2 = BSV (Kryptex), 3 = Quai (K1Pool).
#
# Unité de comparaison : USD gagnés par jour pour 1 TH/s, frais du pool déduits. Les trois pools minent
# en SHA-256 avec le même matériel, donc la consommation est identique et s'annule : on compare
# seulement le revenu.
#
# SÉCURITÉ : la bascule est désactivée tant que vous n'avez pas allumé `Bascule auto des pools`.
# Les capteurs de rentabilité fonctionnent dès le démarrage : observez-les d'abord.

input_boolean:
  profit_switching_enabled:
    name: "Bascule auto des pools"
    icon: mdi:swap-horizontal

# Remises à ces valeurs à chaque redémarrage de Home Assistant : modifiez `initial` ici pour changer.
input_number:
  profit_min_gain:
    name: "Gain minimal pour basculer"
    icon: mdi:percent
    min: 0
    max: 50
    step: 0.5
    initial: 5
    unit_of_measurement: "%"
    mode: box
  profit_min_minutes:
    name: "Durée minimale entre deux bascules"
    icon: mdi:timer-outline
    min: 5
    max: 240
    step: 5
    initial: 30
    unit_of_measurement: "min"
    mode: box
  profit_fee_btc:
    name: "Frais du pool BTC"
    icon: mdi:percent
    min: 0
    max: 10
    step: 0.1
    initial: 2.5   # f2pool : à vérifier sur votre compte
    unit_of_measurement: "%"
    mode: box
  profit_quai_factor:
    name: "Correction du gain Quai"
    icon: mdi:tune
    min: 0.1
    max: 10
    step: 0.05
    initial: 1
    mode: box

# --- Données (rafraîchies toutes les 10 min) ---------------------------------------------------
rest:
  # Kryptex : `estimated_profit_day` = coin gagné par H/s et par jour, frais du pool déduits.
  # On le ramène en brut (÷ (1 - frais)) en « sat par TH/s et par jour » (1 sat = 1e-8 coin).
  - resource: https://pool.kryptex.com/btc/api/v1/pool/info
    scan_interval: 600
    sensor:
      - name: "Gain brut BTC"
        unique_id: profit_gross_btc
        unit_of_measurement: "sat/TH/jour"
        value_template: >-
          {{ (value_json.estimated_profit_day / (1 - value_json.fee) * 1e20) | round(2) }}

  - resource: https://pool.kryptex.com/bsv/api/v1/pool/info
    scan_interval: 600
    sensor:
      - name: "Gain brut BSV"
        unique_id: profit_gross_bsv
        unit_of_measurement: "sat/TH/jour"
        value_template: >-
          {{ (value_json.estimated_profit_day / (1 - value_json.fee) * 1e20) | round(2) }}
        json_attributes:
          - fee

  # K1Pool : pas d'estimation toute faite pour le Quai, on la calcule :
  # récompense par bloc x blocs par jour x (1 TH/s / hashrate du réseau).
  - resource: https://k1pool.com/api/stats/quaisha256
    scan_interval: 600
    sensor:
      - name: "Gain brut Quai"
        unique_id: profit_gross_quai
        unit_of_measurement: "QUAI/TH/jour"
        value_template: >-
          {{ (value_json.coinReward * 86400 / value_json.coinBlocktime * 1e12
              / value_json.networkSpeed) | round(4) }}
        json_attributes:
          - coinPriceUsd
          - coinPoolFee

  # Prix du BTC et du BSV (K1Pool donne celui du Quai ; Kryptex n'a pas de prix pour le BSV).
  - resource: https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,bitcoin-cash-sv&vs_currencies=usd
    scan_interval: 600
    sensor:
      - name: "Prix BTC"
        unique_id: profit_price_btc
        unit_of_measurement: "USD"
        value_template: "{{ value_json['bitcoin']['usd'] }}"
      - name: "Prix BSV"
        unique_id: profit_price_bsv
        unit_of_measurement: "USD"
        value_template: "{{ value_json['bitcoin-cash-sv']['usd'] }}"

# --- Rentabilité de chaque pool, en USD par jour et par TH/s, frais déduits -----------------
template:
  - sensor:
      - name: "Rentabilité BTC"
        unique_id: profit_usd_btc
        unit_of_measurement: "USD/TH/jour"
        icon: mdi:currency-btc
        state: >-
          {{ (states('sensor.gain_brut_btc') | float * 1e-8
              * states('sensor.prix_btc') | float
              * (1 - states('input_number.profit_fee_btc') | float / 100)) | round(5) }}
        availability: >-
          {{ states('sensor.gain_brut_btc') | is_number and states('sensor.prix_btc') | is_number }}

      - name: "Rentabilité BSV"
        unique_id: profit_usd_bsv
        unit_of_measurement: "USD/TH/jour"
        icon: mdi:alpha-b-circle-outline
        state: >-
          {{ (states('sensor.gain_brut_bsv') | float * 1e-8
              * states('sensor.prix_bsv') | float
              * (1 - state_attr('sensor.gain_brut_bsv', 'fee') | float(0))) | round(5) }}
        availability: >-
          {{ states('sensor.gain_brut_bsv') | is_number and states('sensor.prix_bsv') | is_number
             and state_attr('sensor.gain_brut_bsv', 'fee') | is_number }}

      - name: "Rentabilité Quai"
        unique_id: profit_usd_quai
        unit_of_measurement: "USD/TH/jour"
        icon: mdi:alpha-q-circle-outline
        # Le facteur de correction sert à caler l'estimation sur vos gains réels (voir le README).
        state: >-
          {{ (states('sensor.gain_brut_quai') | float
              * state_attr('sensor.gain_brut_quai', 'coinPriceUsd') | float
              * (1 - state_attr('sensor.gain_brut_quai', 'coinPoolFee') | float / 100)
              * states('input_number.profit_quai_factor') | float) | round(5) }}
        availability: >-
          {{ states('sensor.gain_brut_quai') | is_number
             and state_attr('sensor.gain_brut_quai', 'coinPriceUsd') | is_number
             and state_attr('sensor.gain_brut_quai', 'coinPoolFee') | is_number }}

      # Numéro du pool le plus rentable ("1", "2" ou "3"). Indisponible si une des trois valeurs manque :
      # on ne compare pas sur des données partielles.
      - name: "Meilleur pool"
        unique_id: profit_best_pool
        icon: mdi:trophy-outline
        state: >-
          {% set p = {'1': states('sensor.rentabilite_btc') | float(0),
                      '2': states('sensor.rentabilite_bsv') | float(0),
                      '3': states('sensor.rentabilite_quai') | float(0)} %}
          {{ (p | dictsort(false, 'value') | last)[0] }}
        attributes:
          classement: >-
            {% set p = {'BTC': states('sensor.rentabilite_btc') | float(0),
                        'BSV': states('sensor.rentabilite_bsv') | float(0),
                        'Quai': states('sensor.rentabilite_quai') | float(0)} %}
            {{ p | dictsort(false, 'value', true) | map('join', ' = ') | list }}
        availability: >-
          {{ states('sensor.rentabilite_btc') | is_number
             and states('sensor.rentabilite_bsv') | is_number
             and states('sensor.rentabilite_quai') | is_number }}

# --- Automatisation ---------------------------------------------------------------------------
automation:
  - alias: "Mineur - bascule auto du pool selon la rentabilité"
    id: vnish_profit_pool_switch
    mode: single
    max_exceeded: silent
    variables:
      # À adapter : remplacez « antminer_s19 » par le nom de votre mineur dans Home Assistant.
      active_pool: select.antminer_s19_active_pool
      mining: switch.antminer_s19_mining
      problem: binary_sensor.antminer_s19_problem
      # Numéro de pool -> capteur de rentabilité.
      profit:
        "1": sensor.rentabilite_btc
        "2": sensor.rentabilite_bsv
        "3": sensor.rentabilite_quai
      # Home Assistant convertit le texte "3" en nombre 3 : on le remet en texte à chaque usage.
      best: "{{ states('sensor.meilleur_pool') }}"
      current: "{{ states(active_pool) }}"
    triggers:
      - trigger: time_pattern
        minutes: "/10"
    conditions:
      - alias: "La bascule auto est activée"
        condition: state
        entity_id: input_boolean.profit_switching_enabled
        state: "on"
      - alias: "Le mineur mine et n'est pas en panne"
        condition: template
        value_template: "{{ is_state(mining, 'on') and is_state(problem, 'off') }}"
      - alias: "Pool actif et meilleur pool connus, et différents"
        condition: template
        value_template: >-
          {{ (best | string) in profit and (current | string) in profit
             and (best | string) != (current | string) }}
      - alias: "Gain suffisant par rapport au pool actif"
        condition: template
        value_template: >-
          {{ states(profit[best | string]) | float(0)
             >= states(profit[current | string]) | float(0)
                * (1 + states('input_number.profit_min_gain') | float(5) / 100) }}
      - alias: "Pool actif inchangé depuis assez longtemps"
        condition: template
        value_template: >-
          {{ (now() - (expand(active_pool) | map(attribute='last_changed') | first)).total_seconds()
             >= states('input_number.profit_min_minutes') | float(30) * 60 }}
    actions:
      - action: select.select_option
        target:
          entity_id: "{{ active_pool }}"
        data:
          option: "{{ best | string }}"
      - action: logbook.log
        data:
          name: "Bascule auto du pool"
          message: >-
            Pool {{ current }} -> {{ best }}
            ({{ states(profit[current | string]) }} -> {{ states(profit[best | string]) }} USD/TH/jour)
